services:
  cuotia:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: ${MASTER_KEY:?falta MASTER_KEY (openssl rand -hex 32)}
      PUBLIC_URL: ${PUBLIC_URL:?falta la URL pública, ej. https://cuotia.tudominio.com}
      PORT: "3000"
      DATABASE_PATH: /app/data/cuotia.db
    volumes:
      - cuotia-data:/app/data
    expose:
      - "3000"

volumes:
  cuotia-data:
    # Fixed name: redeploying or renaming the project must never create a second, empty volume.
    name: cuotia-data
