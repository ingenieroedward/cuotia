# Dokploy: crea una app "Docker Compose" apuntando a este repo (rama main), agrega el dominio hacia el
# servicio "cuotia", puerto 3000, con HTTPS, y pon las variables en Environment (ver .env.example).
# Si falta una variable obligatoria, el despliegue se detiene con un mensaje claro en vez de arrancar mal.
services:
  cuotia:
    build: .
    restart: unless-stopped
    environment:
      MASTER_KEY: ${MASTER_KEY:?falta MASTER_KEY (openssl rand -hex 32)}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      PUBLIC_URL: ${PUBLIC_URL:?falta la URL pública, ej. https://cuotia.tudominio.com}
      BACKUP1_NAME: ${BACKUP1_NAME:-}
      BACKUP1_ENDPOINT: ${BACKUP1_ENDPOINT:-}
      BACKUP1_BUCKET: ${BACKUP1_BUCKET:-}
      BACKUP1_REGION: ${BACKUP1_REGION:-}
      BACKUP1_KEY_ID: ${BACKUP1_KEY_ID:-}
      BACKUP1_SECRET: ${BACKUP1_SECRET:-}
      BACKUP1_PREFIX: ${BACKUP1_PREFIX:-}
      BACKUP2_NAME: ${BACKUP2_NAME:-}
      BACKUP2_ENDPOINT: ${BACKUP2_ENDPOINT:-}
      BACKUP2_BUCKET: ${BACKUP2_BUCKET:-}
      BACKUP2_REGION: ${BACKUP2_REGION:-}
      BACKUP2_KEY_ID: ${BACKUP2_KEY_ID:-}
      BACKUP2_SECRET: ${BACKUP2_SECRET:-}
      BACKUP2_PREFIX: ${BACKUP2_PREFIX:-}
      BACKUP3_NAME: ${BACKUP3_NAME:-}
      BACKUP3_ENDPOINT: ${BACKUP3_ENDPOINT:-}
      BACKUP3_BUCKET: ${BACKUP3_BUCKET:-}
      BACKUP3_REGION: ${BACKUP3_REGION:-}
      BACKUP3_KEY_ID: ${BACKUP3_KEY_ID:-}
      BACKUP3_SECRET: ${BACKUP3_SECRET:-}
      BACKUP3_PREFIX: ${BACKUP3_PREFIX:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      PORT: "3000"
      DATABASE_PATH: /app/data/cuotia.db
    volumes:
      - cuotia-data:/app/data
    expose:
      - "3000"

volumes:
  cuotia-data:
    # Fixed name: redeploying or renaming the project must never create a second, empty volume.
    name: cuotia-data
